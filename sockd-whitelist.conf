# Dante sockd configuration: IP whitelist, no username/password.
# Full reference: https://www.inet.no/dante/doc/1.4.x/config/server.html
#
# To use it, mount this file instead of sockd.conf in compose.yaml:
#   - ./sockd-whitelist.conf:/etc/sockd.conf:ro

logoutput: stderr

internal: 0.0.0.0 port = 1080
external: eth0

# No authentication: access is controlled by the client rules below.
socksmethod: none
clientmethod: none

user.privileged: root
user.unprivileged: sockd

timeout.negotiate: 30
timeout.io: 0

# Whitelisted client IPs. Add one "client pass" block per IP or range.
client pass {
    from: 203.0.113.10/32 to: 0.0.0.0/0
    log: error
}

client pass {
    from: 198.51.100.0/24 to: 0.0.0.0/0
    log: error
}

# Everyone else is dropped.
client block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

socks block {
    from: 0.0.0.0/0 to: 127.0.0.0/8
    log: connect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect udpassociate
    protocol: tcp udp
    log: error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: udpreply
    log: error
}
