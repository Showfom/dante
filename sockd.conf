# Dante sockd configuration
# Full reference: https://www.inet.no/dante/doc/1.4.x/config/server.html

logoutput: stderr

# Listen on all interfaces inside the container.
internal: 0.0.0.0 port = 1080
# Outgoing connections use the container's default interface.
external: eth0

# Authentication for SOCKS requests.
#   username - system users inside the container (see PROXY_USER / PROXY_PASSWORD)
#   none     - no authentication (DO NOT expose to the internet like this)
socksmethod: username
clientmethod: none

# Reading /etc/shadow for username auth requires root.
user.privileged: root
user.unprivileged: sockd

timeout.negotiate: 30
timeout.io: 0

# Who may connect to the server.
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}

# Do not allow proxying to the container's own loopback.
socks block {
    from: 0.0.0.0/0 to: 127.0.0.0/8
    log: connect error
}

# Allow authenticated TCP/UDP connections everywhere else.
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect udpassociate
    protocol: tcp udp
    log: error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: udpreply
    log: error
}
